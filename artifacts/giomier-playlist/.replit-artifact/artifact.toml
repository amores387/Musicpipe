kind = "web"
previewPath = "/"
title = "Giomier Playlist"
description = "A personal music collection with free previews, PayMaya unlock requests, owner-curated playlist management, and a secure Vercel connection status."
version = "1.0.0"
id = "artifacts/giomier-playlist"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21024

[services.development]
run = "pnpm --filter @workspace/giomier-playlist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/giomier-playlist", "run", "build" ]
serve = "static"
publicDir = "artifacts/giomier-playlist/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21024"
BASE_PATH = "/"
