openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vercel
    description: Vercel connection operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vercel/status:
    get:
      operationId: getVercelStatus
      tags: [vercel]
      summary: Check the connected Vercel account
      description: Returns a safe summary of the connected Vercel account and its projects without exposing credentials.
      responses:
        "200":
          description: Vercel status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VercelStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VercelProjectSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        framework:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
      required:
        - id
        - name
        - framework
        - updatedAt
    VercelStatus:
      type: object
      properties:
        connected:
          type: boolean
        projectCount:
          type: number
        projects:
          type: array
          items:
            $ref: "#/components/schemas/VercelProjectSummary"
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        - connected
        - projectCount
        - projects
        - checkedAt
        - message

